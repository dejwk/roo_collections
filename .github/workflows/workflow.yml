name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_test:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@e8d1ad9299d01eff945f417ac407df71d698bff5 # roo_testing 2.7.0
    with:
      profiles: >-
        ["host", "arduino_esp32", "idf_esp32", "arduino_esp32s3", "idf_esp32s3",
         "arduino_esp32c3", "idf_esp32c3", "pico_rp2040", "arduino_rp2040",
         "arduino_rp2040_freertos"]
      run_tests: true

  benchmark_tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s benchmarks/hashmap/tests -v
