[platformio]
default_envs = esp32dev
lib_dir = .pio/local-libs
extra_configs = platformio.local*.ini

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
build_type = release
monitor_speed = 115200
extra_scripts =
    pre:scripts/dependencies.py
    post:scripts/receipt.py
lib_extra_dirs = .pio/linked-libs
build_unflags = -Os -std=gnu++11 -std=gnu++2a -std=gnu++2b
build_flags =
    -O2
    -std=gnu++17
    -DNDEBUG
    -DARDUINO_LOOP_STACK_SIZE=16384
